<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title description">
  <title id="title">Missing Number Puzzles — questions only</title>
  <desc id="description">Five original question prompts and blank answer spaces. Answers are provided separately on the HTML worksheet.</desc>
  <rect width="794" height="1123" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#18201c">
    <text x="44" y="39" font-size="10" font-weight="400" fill="#18201c"><tspan x="44" dy="0">MOOCSOFT.NET · FREE WEBSITE WORKSHEET</tspan></text>
    <text x="44" y="73" font-size="28" font-weight="700" fill="#18201c"><tspan x="44" dy="0">Missing Number Puzzles</tspan></text>
    <text x="44" y="95" font-size="12" font-weight="400" fill="#18201c"><tspan x="44" dy="0">Five original questions · Questions only</tspan></text>
    <text x="44" y="119" font-size="11" font-weight="400" fill="#18201c"><tspan x="44" dy="0">• Write the missing value and one line explaining your method for each question.</tspan></text><text x="44" y="138" font-size="11" font-weight="400" fill="#18201c"><tspan x="44" dy="0">• Use the stated rule or rule family consistently across every row.</tspan></text><text x="44" y="157" font-size="11" font-weight="400" fill="#18201c"><tspan x="44" dy="0">• Try the question sheet before turning to the separate answer key. There is no time limit.</tspan></text><text x="44" y="176" font-size="11" font-weight="400" fill="#18201c"><tspan x="44" dy="0">• These are original website practice examples, not solutions to numbered app levels.</tspan></text>
    <g transform="translate(44 200)"><rect width="706" height="148" fill="#fff" stroke="#555"/><text x="15" y="24" font-size="15" font-weight="650" fill="#18201c"><tspan x="15" dy="0">1. Complete a balanced equation</tspan></text><text x="15" y="48" font-size="12" font-weight="400" fill="#18201c"><tspan x="15" dy="0">What number belongs in the box?</tspan></text><text x="15" y="70" font-size="12" font-weight="400" fill="#18201c"><tspan x="15" dy="0">Rule: Use ordinary addition and the operation that reverses adding 18.</tspan></text><text x="15" y="112" font-size="24" font-weight="650" fill="#18201c"><tspan x="15" dy="0">□ + 18 = 47</tspan></text><text x="335" y="109" font-size="12" font-weight="400" fill="#18201c"><tspan x="335" dy="0">Answer:</tspan></text><path d="M386 112h285M335 132h336" stroke="#777" fill="none"/></g>
    <g transform="translate(44 364)"><rect width="345" height="333" fill="#fff" stroke="#555"/><text x="15" y="24" font-size="15" font-weight="650" fill="#18201c"><tspan x="15" dy="0">2. Find the repeated row total</tspan></text><text x="15" y="72" font-size="12" font-weight="400" fill="#18201c"><tspan x="15" dy="0">Complete the last row using the same</tspan><tspan x="15" dy="15">addition rule.</tspan></text><text x="15" y="125" font-size="12" font-weight="400" fill="#18201c"><tspan x="15" dy="0">Rule: Add the first number to the second</tspan><tspan x="15" dy="15">number to get the result.</tspan></text><path d="M15 170h315M15 197h315" stroke="#555" fill="none"/><text x="67.5" y="188" font-size="10" font-weight="650" text-anchor="middle">First number</text><text x="172.5" y="188" font-size="10" font-weight="650" text-anchor="middle">Second number</text><text x="277.5" y="188" font-size="10" font-weight="650" text-anchor="middle">Result</text><text x="67.5" y="217" font-size="17" text-anchor="middle">6</text><text x="172.5" y="217" font-size="17" text-anchor="middle">9</text><text x="277.5" y="217" font-size="17" text-anchor="middle">15</text><path d="M15 224h315" stroke="#aaa" fill="none"/><text x="67.5" y="244" font-size="17" text-anchor="middle">8</text><text x="172.5" y="244" font-size="17" text-anchor="middle">5</text><text x="277.5" y="244" font-size="17" text-anchor="middle">13</text><path d="M15 251h315" stroke="#aaa" fill="none"/><text x="67.5" y="271" font-size="17" text-anchor="middle">7</text><text x="172.5" y="271" font-size="17" text-anchor="middle">12</text><rect x="268.5" y="255" width="18" height="18" fill="#fff" stroke="#444"/><path d="M15 278h315" stroke="#aaa" fill="none"/><text x="15" y="297" font-size="12" font-weight="400" fill="#18201c"><tspan x="15" dy="0">Answer:</tspan></text><path d="M65 300h265M15 321h315" stroke="#777" fill="none"/></g><g transform="translate(405 364)"><rect width="345" height="333" fill="#fff" stroke="#555"/><text x="15" y="24" font-size="15" font-weight="650" fill="#18201c"><tspan x="15" dy="0">3. Multiply, then make one adjustment</tspan></text><text x="15" y="72" font-size="12" font-weight="400" fill="#18201c"><tspan x="15" dy="0">Multiply the first two numbers, then find</tspan><tspan x="15" dy="15">the same subtraction used in both complete</tspan><tspan x="15" dy="15">rows.</tspan></text><text x="15" y="125" font-size="12" font-weight="400" fill="#18201c"><tspan x="15" dy="0">Rule: Use multiplication followed by one</tspan><tspan x="15" dy="15">constant subtraction.</tspan></text><path d="M15 170h315M15 197h315" stroke="#555" fill="none"/><text x="67.5" y="188" font-size="10" font-weight="650" text-anchor="middle">First number</text><text x="172.5" y="188" font-size="10" font-weight="650" text-anchor="middle">Second number</text><text x="277.5" y="188" font-size="10" font-weight="650" text-anchor="middle">Result</text><text x="67.5" y="217" font-size="17" text-anchor="middle">3</text><text x="172.5" y="217" font-size="17" text-anchor="middle">4</text><text x="277.5" y="217" font-size="17" text-anchor="middle">10</text><path d="M15 224h315" stroke="#aaa" fill="none"/><text x="67.5" y="244" font-size="17" text-anchor="middle">5</text><text x="172.5" y="244" font-size="17" text-anchor="middle">3</text><text x="277.5" y="244" font-size="17" text-anchor="middle">13</text><path d="M15 251h315" stroke="#aaa" fill="none"/><text x="67.5" y="271" font-size="17" text-anchor="middle">6</text><text x="172.5" y="271" font-size="17" text-anchor="middle">4</text><rect x="268.5" y="255" width="18" height="18" fill="#fff" stroke="#444"/><path d="M15 278h315" stroke="#aaa" fill="none"/><text x="15" y="297" font-size="12" font-weight="400" fill="#18201c"><tspan x="15" dy="0">Answer:</tspan></text><path d="M65 300h265M15 321h315" stroke="#777" fill="none"/></g><g transform="translate(44 713)"><rect width="345" height="333" fill="#fff" stroke="#555"/><text x="15" y="24" font-size="15" font-weight="650" fill="#18201c"><tspan x="15" dy="0">4. Recover the missing input</tspan></text><text x="15" y="72" font-size="12" font-weight="400" fill="#18201c"><tspan x="15" dy="0">The blank is the second input. Work backward</tspan><tspan x="15" dy="15">from the final result using the stated rule.</tspan></text><text x="15" y="125" font-size="12" font-weight="400" fill="#18201c"><tspan x="15" dy="0">Rule: Result = first number × second number</tspan><tspan x="15" dy="15">+ first number.</tspan></text><path d="M15 170h315M15 197h315" stroke="#555" fill="none"/><text x="67.5" y="188" font-size="10" font-weight="650" text-anchor="middle">First number</text><text x="172.5" y="188" font-size="10" font-weight="650" text-anchor="middle">Second number</text><text x="277.5" y="188" font-size="10" font-weight="650" text-anchor="middle">Result</text><text x="67.5" y="217" font-size="17" text-anchor="middle">2</text><text x="172.5" y="217" font-size="17" text-anchor="middle">5</text><text x="277.5" y="217" font-size="17" text-anchor="middle">12</text><path d="M15 224h315" stroke="#aaa" fill="none"/><text x="67.5" y="244" font-size="17" text-anchor="middle">3</text><text x="172.5" y="244" font-size="17" text-anchor="middle">4</text><text x="277.5" y="244" font-size="17" text-anchor="middle">15</text><path d="M15 251h315" stroke="#aaa" fill="none"/><text x="67.5" y="271" font-size="17" text-anchor="middle">4</text><rect x="163.5" y="255" width="18" height="18" fill="#fff" stroke="#444"/><text x="277.5" y="271" font-size="17" text-anchor="middle">28</text><path d="M15 278h315" stroke="#aaa" fill="none"/><text x="15" y="297" font-size="12" font-weight="400" fill="#18201c"><tspan x="15" dy="0">Answer:</tspan></text><path d="M65 300h265M15 321h315" stroke="#777" fill="none"/></g><g transform="translate(405 713)"><rect width="345" height="333" fill="#fff" stroke="#555"/><text x="15" y="24" font-size="15" font-weight="650" fill="#18201c"><tspan x="15" dy="0">5. Compare two squared values</tspan></text><text x="15" y="72" font-size="12" font-weight="400" fill="#18201c"><tspan x="15" dy="0">Complete the last row by subtracting the</tspan><tspan x="15" dy="15">second square from the first square.</tspan></text><text x="15" y="125" font-size="12" font-weight="400" fill="#18201c"><tspan x="15" dy="0">Rule: Square each input separately, then</tspan><tspan x="15" dy="15">subtract: first² − second².</tspan></text><path d="M15 170h315M15 197h315" stroke="#555" fill="none"/><text x="67.5" y="188" font-size="10" font-weight="650" text-anchor="middle">First number</text><text x="172.5" y="188" font-size="10" font-weight="650" text-anchor="middle">Second number</text><text x="277.5" y="188" font-size="10" font-weight="650" text-anchor="middle">Result</text><text x="67.5" y="217" font-size="17" text-anchor="middle">5</text><text x="172.5" y="217" font-size="17" text-anchor="middle">3</text><text x="277.5" y="217" font-size="17" text-anchor="middle">16</text><path d="M15 224h315" stroke="#aaa" fill="none"/><text x="67.5" y="244" font-size="17" text-anchor="middle">7</text><text x="172.5" y="244" font-size="17" text-anchor="middle">4</text><text x="277.5" y="244" font-size="17" text-anchor="middle">33</text><path d="M15 251h315" stroke="#aaa" fill="none"/><text x="67.5" y="271" font-size="17" text-anchor="middle">9</text><text x="172.5" y="271" font-size="17" text-anchor="middle">5</text><rect x="268.5" y="255" width="18" height="18" fill="#fff" stroke="#444"/><path d="M15 278h315" stroke="#aaa" fill="none"/><text x="15" y="297" font-size="12" font-weight="400" fill="#18201c"><tspan x="15" dy="0">Answer:</tspan></text><path d="M65 300h265M15 321h315" stroke="#777" fill="none"/></g>
    <text x="44" y="1072" font-size="10" font-weight="400" fill="#18201c"><tspan x="44" dy="0">Explain your method on the writing lines. Check the separate answer key after attempting all five questions.</tspan></text>
    <a href="https://moocsoft.net/guides/missing-number-puzzles-with-answers/"><text x="44" y="1090" font-size="10" font-weight="400" fill="#18201c"><tspan x="44" dy="0">Guide: moocsoft.net/guides/missing-number-puzzles-with-answers/</tspan></text></a>
  </g>
</svg>
