<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description"><title id="title">Example cigarette spending across three time periods</title><desc id="description">An invented 10-dollar pack of 20 and 10 cigarettes per day gives 5 dollars for 1 day, 150 dollars for 30 days and 1825 dollars for 365 days. Horizontal bars use a shared linear scale.</desc><rect width="1200" height="675" fill="#f2f6ef"/>
  <circle cx="1083" cy="88" r="179" fill="#e2eadc"/><circle cx="39" cy="610" r="205" fill="#e2eadc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193a2b">
    <text x="600" y="115" font-size="32" font-weight="700" text-anchor="middle">10/day · $10/20-pack</text>
    <text x="186" y="254" font-size="32" text-anchor="end">1 day</text><path d="M229 214v76" stroke="#b2c3b0" stroke-width="2"/><rect x="229" y="223" width="1.8493150684931507" height="50" rx="0.9246575342465754" fill="#85a68d"/><circle cx="230.84931506849315" cy="248" r="5" fill="#23624c"/><text x="250.84931506849315" y="257" font-size="35" font-weight="700">$5</text><text x="186" y="387" font-size="32" text-anchor="end">30 days</text><path d="M229 347v76" stroke="#b2c3b0" stroke-width="2"/><rect x="229" y="356" width="55.47945205479452" height="50" rx="8" fill="#408564"/><circle cx="284.47945205479454" cy="381" r="5" fill="#23624c"/><text x="304.47945205479454" y="390" font-size="35" font-weight="700">$150</text><text x="186" y="520" font-size="32" text-anchor="end">365 days</text><path d="M229 480v76" stroke="#b2c3b0" stroke-width="2"/><rect x="229" y="489" width="675" height="50" rx="8" fill="#23624c"/><circle cx="904" cy="514" r="5" fill="#23624c"/><text x="924" y="523" font-size="35" font-weight="700">$1,825</text>
    <g transform="translate(76 547)" fill="#e8d69a" stroke="#b99d59" stroke-width="2"><ellipse cx="53" cy="38" rx="43" ry="12"/><path d="M10 24v13c0 16 86 16 86 0V24" fill="#d5be75"/><ellipse cx="53" cy="24" rx="43" ry="12"/><circle cx="132" cy="27" r="29"/><circle cx="132" cy="27" r="20" fill="none"/></g>
    <text x="744" y="613" font-size="27" text-anchor="middle">Illustrative price · constant baseline</text>
  </g></svg>
