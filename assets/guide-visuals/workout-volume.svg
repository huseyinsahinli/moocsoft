<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description"><title id="title">Add volume from each unequal workout set</title><desc id="description">Three bars show set 1: 10 repetitions times 50 kilograms equals 500; set 2: 8 times 50 equals 400; set 3: 8 times 45 equals 360. Total volume load is 1260 kilograms.</desc><rect width="1200" height="675" fill="#f2f6ef"/>
  <circle cx="1112" cy="83" r="178" fill="#dcead7"/><circle cx="36" cy="614" r="192" fill="#e2ebdc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193a2b">
    <g text-anchor="middle"><text x="600" y="111" font-size="46" font-weight="700">1,260 kg</text><text x="600" y="150" font-size="27">500 + 400 + 360</text></g>
    <circle cx="153" cy="265" r="23" fill="#d1e3d4"/><text x="153" y="275" font-size="30" font-weight="700" text-anchor="middle">1</text><text x="211" y="274" font-size="35">10 × 50</text><rect x="415" y="237" width="520" height="61" rx="10" fill="#23624c"/><text x="950" y="277" font-size="35" font-weight="700">500</text><circle cx="153" cy="373" r="23" fill="#d1e3d4"/><text x="153" y="383" font-size="30" font-weight="700" text-anchor="middle">2</text><text x="211" y="382" font-size="35">8 × 50</text><rect x="415" y="345" width="416" height="61" rx="10" fill="#408564"/><text x="846" y="385" font-size="35" font-weight="700">400</text><circle cx="153" cy="481" r="23" fill="#d1e3d4"/><text x="153" y="491" font-size="30" font-weight="700" text-anchor="middle">3</text><text x="211" y="490" font-size="35">8 × 45</text><rect x="415" y="453" width="374.4" height="61" rx="10" fill="#6da382"/><text x="804.4" y="493" font-size="35" font-weight="700">360</text>
    <text x="250" y="602" font-size="26" text-anchor="middle">reps × kg</text><text x="688" y="602" font-size="26" text-anchor="middle">volume load (kg)</text>
  </g></svg>
