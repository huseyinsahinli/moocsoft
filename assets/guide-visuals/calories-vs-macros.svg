<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description"><title id="title">Macro grams contribute different amounts of food energy</title><desc id="description">An illustrative stacked energy bar converts 30 grams protein to 120 kilocalories, 50 grams carbohydrate to 200 kilocalories, and 15 grams fat to 135 kilocalories, totaling 455.</desc><rect width="1200" height="675" fill="#f2f6ef"/>
  <circle cx="1076" cy="91" r="179" fill="#e2eadc"/><circle cx="46" cy="600" r="203" fill="#e2eadc"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#193a2b">
    <text x="600" y="132" font-size="48" font-weight="700">455 kcal</text>
    <rect x="170" y="237" width="226.8131868131868" height="138" fill="#408564"/><text x="283.4065934065934" y="205" font-size="36" font-weight="700">120 kcal</text><path d="M283.4065934065934 215v14" stroke="#408564" stroke-width="3"/><rect x="396.8131868131868" y="237" width="378.02197802197804" height="138" fill="#608aaa"/><text x="585.8241758241759" y="205" font-size="36" font-weight="700">200 kcal</text><path d="M585.8241758241759 215v14" stroke="#608aaa" stroke-width="3"/><rect x="774.8351648351648" y="237" width="255.16483516483515" height="138" fill="#c4a45c"/><text x="902.4175824175825" y="205" font-size="36" font-weight="700">135 kcal</text><path d="M902.4175824175825 215v14" stroke="#c4a45c" stroke-width="3"/>
    <path d="M170 403v13h860v-13" stroke="#829989" stroke-width="3" fill="none"/>
    <rect x="162" y="459" width="264" height="116" rx="15" fill="#d4e7d7"/><circle cx="193" cy="489" r="9" fill="#408564"/><text x="307" y="499" font-size="29" font-weight="700">Protein</text><text x="294" y="544" font-size="30">30 g × 4</text><rect x="468" y="459" width="264" height="116" rx="15" fill="#d9e5ee"/><circle cx="499" cy="489" r="9" fill="#608aaa"/><text x="613" y="499" font-size="29" font-weight="700">Carbs</text><text x="600" y="544" font-size="30">50 g × 4</text><rect x="774" y="459" width="264" height="116" rx="15" fill="#efe3c6"/><circle cx="805" cy="489" r="9" fill="#c4a45c"/><text x="919" y="499" font-size="29" font-weight="700">Fat</text><text x="906" y="544" font-size="30">15 g × 9</text>
  </g></svg>
