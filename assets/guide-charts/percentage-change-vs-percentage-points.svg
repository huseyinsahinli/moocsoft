<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description"><title id="title">One rise. Two different units.</title><desc id="description">A rate rises from 40% to 50%: a 10-percentage-point difference, or a 25% relative increase from the starting rate of 40%.</desc><rect width="1200" height="675" fill="#151513"/><path d="M64 158H1136" stroke="#4f4a42" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="53" font-size="23" font-weight="700" fill="#f1a27b" text-anchor="start">PERCENTAGE CHANGE</text><text x="64" y="119" font-size="43" font-weight="700" fill="#f2ede3" text-anchor="start">One rise. Two different units.</text><text x="350" y="246" font-size="78" font-weight="700" fill="#f2ede3" text-anchor="middle">40%</text><path d="M580 221h40m-13-13 13 13-13 13" fill="none" stroke="#f1a27b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="850" y="246" font-size="78" font-weight="700" fill="#f2ede3" text-anchor="middle">50%</text><rect x="64" y="300" width="520" height="238" rx="18" fill="#22221f" stroke="#4f4a42" stroke-width="2"/><rect x="616" y="300" width="520" height="238" rx="18" fill="#22221f" stroke="#4f4a42" stroke-width="2"/><text x="94" y="352" font-size="30" font-weight="400" fill="#c2b9aa" text-anchor="start">Direct difference</text><text x="94" y="420" font-size="40" font-weight="700" fill="#f1a27b" text-anchor="start">+10 percentage points</text><text x="94" y="484" font-size="36" font-weight="400" fill="#f2ede3" text-anchor="start">50 − 40 = 10</text><text x="646" y="352" font-size="30" font-weight="400" fill="#c2b9aa" text-anchor="start">Relative to the original</text><text x="646" y="420" font-size="54" font-weight="700" fill="#a7cfb0" text-anchor="start">+25%</text><text x="646" y="484" font-size="36" font-weight="400" fill="#f2ede3" text-anchor="start">10 ÷ 40 × 100 = 25%</text><text x="64" y="593" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">Same fictional rate change; different questions and units.</text></g></svg>
