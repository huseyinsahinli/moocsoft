<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description"><title id="title">A saved request is not a confirmed place.</title><desc id="description">The phone can save a draft request, then send it to the booking service. Only the service’s accepted response confirms the reservation; a saved or sent request does not secure a place.</desc><rect width="1200" height="675" fill="#151513"/><path d="M64 158H1136" stroke="#4f4a42" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="53" font-size="23" font-weight="700" fill="#f1a27b" text-anchor="start">FICTIONAL BOOKING WORKFLOW</text><text x="64" y="119" font-size="43" font-weight="700" fill="#f2ede3" text-anchor="start">A saved request is not a confirmed place.</text><rect x="64" y="260" width="336" height="235" rx="18" fill="#22221f" stroke="#4f4a42" stroke-width="2"/><text x="88" y="314" font-size="35" font-weight="400" fill="#c2b9aa" text-anchor="start">01</text><text x="88" y="374" font-size="40" font-weight="700" fill="#f2ede3" text-anchor="start">Draft saved</text><text x="88" y="436" font-size="29" font-weight="400" fill="#c2b9aa" text-anchor="start">Saved on phone</text><path d="M396 382h40m-13-13 13 13-13 13" fill="none" stroke="#f1a27b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="432" y="260" width="336" height="235" rx="18" fill="#22221f" stroke="#4f4a42" stroke-width="2"/><text x="456" y="314" font-size="35" font-weight="400" fill="#c2b9aa" text-anchor="start">02</text><text x="456" y="374" font-size="40" font-weight="700" fill="#f2ede3" text-anchor="start">Request sent</text><text x="456" y="436" font-size="29" font-weight="400" fill="#c2b9aa" text-anchor="start">Await service reply</text><path d="M764 382h40m-13-13 13 13-13 13" fill="none" stroke="#f1a27b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="800" y="260" width="336" height="235" rx="18" fill="#22221f" stroke="#4f4a42" stroke-width="2"/><text x="824" y="314" font-size="35" font-weight="400" fill="#c2b9aa" text-anchor="start">03</text><text x="824" y="374" font-size="40" font-weight="700" fill="#a7cfb0" text-anchor="start">Confirmed</text><text x="824" y="436" font-size="29" font-weight="400" fill="#c2b9aa" text-anchor="start">Service accepted</text><text x="64" y="593" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">Only the service’s accepted reservation secures the place in this example.</text><text x="64" y="630" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">No confirmation yet? Do not display a confirmed booking.</text></g></svg>
