<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description"><title id="title">Check all the goals against one budget.</title><desc id="description">Monthly requirements of $100 for an annual bill, $150 for a trip and $200 for a laptop total $450. A $300 monthly contribution budget leaves a $150 shortfall.</desc><rect width="1200" height="675" fill="#151513"/><path d="M64 158H1136" stroke="#4f4a42" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="53" font-size="23" font-weight="700" fill="#f1a27b" text-anchor="start">FICTIONAL MONTHLY PLAN</text><text x="64" y="119" font-size="43" font-weight="700" fill="#f2ede3" text-anchor="start">Check all the goals against one budget.</text><text x="64" y="240" font-size="44" font-weight="700" fill="#f2ede3" text-anchor="start">$450 required each month</text><rect x="88" y="294" width="227.55555555555554" height="104" rx="0" fill="#a7cfb0" stroke="#151513" stroke-width="2"/><text x="201.77777777777777" y="356" font-size="42" font-weight="700" fill="#151513" text-anchor="middle">$100</text><text x="201.77777777777777" y="448" font-size="29" font-weight="400" fill="#c2b9aa" text-anchor="middle">Annual bill</text><rect x="315.55555555555554" y="294" width="341.3333333333333" height="104" rx="0" fill="#e9c783" stroke="#151513" stroke-width="2"/><text x="486.2222222222222" y="356" font-size="42" font-weight="700" fill="#151513" text-anchor="middle">$150</text><text x="486.2222222222222" y="448" font-size="29" font-weight="400" fill="#c2b9aa" text-anchor="middle">Trip</text><rect x="656.8888888888889" y="294" width="455.1111111111111" height="104" rx="0" fill="#f1a27b" stroke="#151513" stroke-width="2"/><text x="884.4444444444445" y="356" font-size="42" font-weight="700" fill="#151513" text-anchor="middle">$200</text><text x="884.4444444444445" y="448" font-size="29" font-weight="400" fill="#c2b9aa" text-anchor="middle">Laptop</text><line x1="770.6666666666666" y1="276" x2="770.6666666666666" y2="411" stroke="#f2ede3" stroke-width="4"/><text x="64" y="526" font-size="42" font-weight="700" fill="#f2ede3" text-anchor="start">Budget $300   ·   Shortfall $150</text><text x="64" y="593" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">One shared scale. The vertical marker is the $300 budget.</text><text x="64" y="630" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">Fictional contribution requirements, not an affordable-budget recommendation.</text></g></svg>
