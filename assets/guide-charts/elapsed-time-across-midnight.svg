<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description"><title id="title">Cross midnight without losing the date.</title><desc id="description">A proportional timeline from Monday 23:40 to Tuesday 01:15 has a 20-minute segment to midnight and a 75-minute segment after it, totaling 95 minutes.</desc><rect width="1200" height="675" fill="#151513"/><path d="M64 158H1136" stroke="#4f4a42" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="53" font-size="23" font-weight="700" fill="#f1a27b" text-anchor="start">ELAPSED TIME</text><text x="64" y="119" font-size="43" font-weight="700" fill="#f2ede3" text-anchor="start">Cross midnight without losing the date.</text><text x="110" y="248" font-size="30" font-weight="400" fill="#c2b9aa" text-anchor="start">Monday</text><text x="110" y="302" font-size="46" font-weight="700" fill="#f2ede3" text-anchor="start">23:40</text><text x="328.3157894736842" y="248" font-size="30" font-weight="400" fill="#c2b9aa" text-anchor="start">Tuesday</text><text x="328.3157894736842" y="302" font-size="46" font-weight="700" fill="#f2ede3" text-anchor="start">00:00</text><text x="1090" y="302" font-size="46" font-weight="700" fill="#f2ede3" text-anchor="end">01:15</text><line x1="110" y1="367" x2="316.3157894736842" y2="367" stroke="#f1a27b" stroke-width="22"/><line x1="316.3157894736842" y1="367" x2="1090" y2="367" stroke="#a7cfb0" stroke-width="22"/><line x1="110" y1="341" x2="110" y2="393" stroke="#f2ede3" stroke-width="3"/><line x1="316.3157894736842" y1="341" x2="316.3157894736842" y2="393" stroke="#f2ede3" stroke-width="3"/><line x1="1090" y1="341" x2="1090" y2="393" stroke="#f2ede3" stroke-width="3"/><text x="213.1578947368421" y="441" font-size="42" font-weight="700" fill="#f1a27b" text-anchor="middle">20 min</text><text x="703.1578947368421" y="441" font-size="42" font-weight="700" fill="#a7cfb0" text-anchor="middle">75 min</text><text x="600" y="526" font-size="48" font-weight="700" fill="#f2ede3" text-anchor="middle">20 + 75 = 95 minutes</text><text x="64" y="593" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">Segments share one time scale. The finish is explicitly the next day.</text><text x="64" y="630" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">Assumes an unchanged UTC offset; no clock or time-zone changes.</text></g></svg>
