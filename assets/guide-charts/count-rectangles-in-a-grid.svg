<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description"><title id="title">Six cells. Eighteen rectangles.</title><desc id="description">A complete grid with 2 rows and 3 columns has 3 horizontal boundaries and 4 vertical boundaries. Choose a horizontal pair in 3 ways and a vertical pair in 6 ways: 18 rectangles.</desc><rect width="1200" height="675" fill="#151513"/><path d="M64 158H1136" stroke="#4f4a42" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="53" font-size="23" font-weight="700" fill="#f1a27b" text-anchor="start">COUNT EVERY SIZE</text><text x="64" y="119" font-size="43" font-weight="700" fill="#f2ede3" text-anchor="start">Six cells. Eighteen rectangles.</text><rect x="112" y="245" width="450" height="260" rx="0" fill="#151513" stroke="#4f4a42" stroke-width="2"/><rect x="112" y="245" width="300" height="130" rx="0" fill="#4c3a2c" stroke="#f1a27b" stroke-width="2"/><line x1="112" y1="245" x2="562" y2="245" stroke="#e9c783" stroke-width="3"/><text x="82" y="254" font-size="30" font-weight="400" fill="#c2b9aa" text-anchor="end">A</text><line x1="112" y1="375" x2="562" y2="375" stroke="#e9c783" stroke-width="3"/><text x="82" y="384" font-size="30" font-weight="400" fill="#c2b9aa" text-anchor="end">B</text><line x1="112" y1="505" x2="562" y2="505" stroke="#e9c783" stroke-width="3"/><text x="82" y="514" font-size="30" font-weight="400" fill="#c2b9aa" text-anchor="end">C</text><line x1="112" y1="245" x2="112" y2="505" stroke="#e9c783" stroke-width="3"/><text x="112" y="218" font-size="30" font-weight="400" fill="#c2b9aa" text-anchor="middle">1</text><line x1="262" y1="245" x2="262" y2="505" stroke="#e9c783" stroke-width="3"/><text x="262" y="218" font-size="30" font-weight="400" fill="#c2b9aa" text-anchor="middle">2</text><line x1="412" y1="245" x2="412" y2="505" stroke="#e9c783" stroke-width="3"/><text x="412" y="218" font-size="30" font-weight="400" fill="#c2b9aa" text-anchor="middle">3</text><line x1="562" y1="245" x2="562" y2="505" stroke="#e9c783" stroke-width="3"/><text x="562" y="218" font-size="30" font-weight="400" fill="#c2b9aa" text-anchor="middle">4</text><text x="650" y="269" font-size="31" font-weight="400" fill="#c2b9aa" text-anchor="start">Choose boundary pairs</text><text x="650" y="332" font-size="34" font-weight="400" fill="#f2ede3" text-anchor="start">3 horizontal choices</text><text x="650" y="389" font-size="34" font-weight="400" fill="#f2ede3" text-anchor="start">× 6 vertical choices</text><text x="650" y="479" font-size="49" font-weight="700" fill="#a7cfb0" text-anchor="start">18 rectangles</text><text x="64" y="593" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">Complete 2-row × 3-column grid. Squares count.</text><text x="64" y="630" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">The shaded 1 × 2 rectangle is only one of the eighteen.</text></g></svg>
