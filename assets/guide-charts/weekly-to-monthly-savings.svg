<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description"><title id="title">Same weekly amount. Different months.</title><desc id="description">Five planned Friday deposits of $25 in January 2027 total $125; four planned Friday deposits of $25 in February total $100. These are planned amounts, not actual deposits.</desc><rect width="1200" height="675" fill="#151513"/><path d="M64 158H1136" stroke="#4f4a42" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="53" font-size="23" font-weight="700" fill="#f1a27b" text-anchor="start">ILLUSTRATIVE SAVINGS PLAN</text><text x="64" y="119" font-size="43" font-weight="700" fill="#f2ede3" text-anchor="start">Same weekly amount. Different months.</text><rect x="64" y="216" width="520" height="326" rx="18" fill="#22221f" stroke="#4f4a42" stroke-width="2"/><text x="94" y="270" font-size="34" font-weight="400" fill="#c2b9aa" text-anchor="start">January 2027</text><rect x="94" y="303" width="73" height="65" rx="12" fill="#a7cfb0" stroke="#4f4a42" stroke-width="2"/><text x="130" y="347" font-size="40" font-weight="700" fill="#151513" text-anchor="middle">1</text><rect x="183" y="303" width="73" height="65" rx="12" fill="#a7cfb0" stroke="#4f4a42" stroke-width="2"/><text x="219" y="347" font-size="40" font-weight="700" fill="#151513" text-anchor="middle">8</text><rect x="272" y="303" width="73" height="65" rx="12" fill="#a7cfb0" stroke="#4f4a42" stroke-width="2"/><text x="308" y="347" font-size="40" font-weight="700" fill="#151513" text-anchor="middle">15</text><rect x="361" y="303" width="73" height="65" rx="12" fill="#a7cfb0" stroke="#4f4a42" stroke-width="2"/><text x="397" y="347" font-size="40" font-weight="700" fill="#151513" text-anchor="middle">22</text><rect x="450" y="303" width="73" height="65" rx="12" fill="#a7cfb0" stroke="#4f4a42" stroke-width="2"/><text x="486" y="347" font-size="40" font-weight="700" fill="#151513" text-anchor="middle">29</text><text x="94" y="424" font-size="38" font-weight="400" fill="#f2ede3" text-anchor="start">5 Fridays × $25</text><text x="94" y="501" font-size="49" font-weight="700" fill="#a7cfb0" text-anchor="start">$125 planned</text><rect x="616" y="216" width="520" height="326" rx="18" fill="#22221f" stroke="#4f4a42" stroke-width="2"/><text x="646" y="270" font-size="34" font-weight="400" fill="#c2b9aa" text-anchor="start">February 2027</text><rect x="646" y="303" width="73" height="65" rx="12" fill="#f1a27b" stroke="#4f4a42" stroke-width="2"/><text x="682" y="347" font-size="40" font-weight="700" fill="#151513" text-anchor="middle">5</text><rect x="735" y="303" width="73" height="65" rx="12" fill="#f1a27b" stroke="#4f4a42" stroke-width="2"/><text x="771" y="347" font-size="40" font-weight="700" fill="#151513" text-anchor="middle">12</text><rect x="824" y="303" width="73" height="65" rx="12" fill="#f1a27b" stroke="#4f4a42" stroke-width="2"/><text x="860" y="347" font-size="40" font-weight="700" fill="#151513" text-anchor="middle">19</text><rect x="913" y="303" width="73" height="65" rx="12" fill="#f1a27b" stroke="#4f4a42" stroke-width="2"/><text x="949" y="347" font-size="40" font-weight="700" fill="#151513" text-anchor="middle">26</text><text x="646" y="424" font-size="38" font-weight="400" fill="#f2ede3" text-anchor="start">4 Fridays × $25</text><text x="646" y="501" font-size="49" font-weight="700" fill="#f1a27b" text-anchor="start">$100 planned</text><text x="64" y="593" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">Each box is a calendar date, not evidence of a completed deposit.</text><text x="64" y="630" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">Illustrative plan only; not payroll dates or bank-processing promises.</text></g></svg>
