<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description"><title id="title">An input is not a measurement of oil eaten.</title><desc id="description">A bottle changes from 842 to 814 grams, giving 28 grams dispensed. At an invented 120 kcal per 14 grams, the input is 240 kcal. Assuming full transfer, retention and even mixing in an 800-gram dish, a 200-gram portion gets a 60-kcal oil allocation.</desc><rect width="1200" height="675" fill="#151513"/><path d="M64 158H1136" stroke="#4f4a42" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="53" font-size="23" font-weight="700" fill="#f1a27b" text-anchor="start">HYPOTHETICAL LABEL EXAMPLE</text><text x="64" y="119" font-size="43" font-weight="700" fill="#f2ede3" text-anchor="start">An input is not a measurement of oil eaten.</text><rect x="64" y="225" width="515" height="292" rx="18" fill="#22221f" stroke="#4f4a42" stroke-width="2"/><rect x="621" y="225" width="515" height="292" rx="18" fill="#22221f" stroke="#4f4a42" stroke-width="2"/><text x="94" y="278" font-size="30" font-weight="400" fill="#c2b9aa" text-anchor="start">Measured bottle difference</text><text x="94" y="345" font-size="42" font-weight="700" fill="#f1a27b" text-anchor="start">842 − 814 = 28 g</text><text x="94" y="407" font-size="40" font-weight="400" fill="#f2ede3" text-anchor="start">28 ÷ 14 × 120</text><text x="94" y="472" font-size="45" font-weight="700" fill="#f1a27b" text-anchor="start">240 kcal input</text><text x="651" y="278" font-size="29" font-weight="400" fill="#c2b9aa" text-anchor="start">Conditional portion allocation</text><text x="651" y="345" font-size="37" font-weight="700" fill="#f2ede3" text-anchor="start">200 g of an 800 g dish</text><text x="651" y="407" font-size="40" font-weight="400" fill="#f2ede3" text-anchor="start">240 × (200 ÷ 800)</text><text x="651" y="472" font-size="45" font-weight="700" fill="#a7cfb0" text-anchor="start">60 kcal oil share</text><text x="64" y="593" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">Assumes full transfer, retention and even mixing for the portion.</text><text x="64" y="630" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">Hypothetical label: 120 kcal per 14 g. Not measured absorption.</text></g></svg>
