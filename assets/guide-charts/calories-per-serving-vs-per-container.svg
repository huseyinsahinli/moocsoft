<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description"><title id="title">Scale the label to the amount eaten.</title><desc id="description">An invented label gives 180 kcal for 40 grams. A measured 70-gram amount is 1.75 labeled servings, giving an approximate label-based estimate of 315 kcal.</desc><rect width="1200" height="675" fill="#151513"/><path d="M64 158H1136" stroke="#4f4a42" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="53" font-size="23" font-weight="700" fill="#f1a27b" text-anchor="start">INVENTED PRODUCT LABEL</text><text x="64" y="119" font-size="43" font-weight="700" fill="#f2ede3" text-anchor="start">Scale the label to the amount eaten.</text><rect x="64" y="225" width="520" height="202" rx="18" fill="#22221f" stroke="#4f4a42" stroke-width="2"/><rect x="616" y="225" width="520" height="202" rx="18" fill="#22221f" stroke="#4f4a42" stroke-width="2"/><text x="94" y="279" font-size="30" font-weight="400" fill="#c2b9aa" text-anchor="start">Hypothetical label</text><text x="94" y="351" font-size="46" font-weight="700" fill="#f2ede3" text-anchor="start">180 kcal / 40 g</text><text x="646" y="279" font-size="30" font-weight="400" fill="#c2b9aa" text-anchor="start">Measured amount eaten</text><text x="646" y="351" font-size="40" font-weight="700" fill="#a7cfb0" text-anchor="start">70 g = 1.75 servings</text><text x="600" y="513" font-size="50" font-weight="700" fill="#f1a27b" text-anchor="middle">180 × (70 ÷ 40) = 315 kcal</text><text x="64" y="593" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">Same product and preparation basis. Not a recommended portion.</text><text x="64" y="630" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">The calculated number is an approximate label-based estimate, not a scan.</text></g></svg>
