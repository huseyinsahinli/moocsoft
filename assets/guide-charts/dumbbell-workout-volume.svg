<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description"><title id="title">Match the load to the counted movement.</title><desc id="description">Paired reps: 3 sets of 10 with two 12-kg dumbbells use a combined 24-kg load for 720 kg volume load. A different alternating record uses 2 sets of 12 total individual movements at 8 kg for 192 kg.</desc><rect width="1200" height="675" fill="#151513"/><path d="M64 158H1136" stroke="#4f4a42" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="53" font-size="23" font-weight="700" fill="#f1a27b" text-anchor="start">TWO SEPARATE FICTIONAL RECORDS</text><text x="64" y="119" font-size="43" font-weight="700" fill="#f2ede3" text-anchor="start">Match the load to the counted movement.</text><rect x="64" y="224" width="520" height="316" rx="18" fill="#22221f" stroke="#4f4a42" stroke-width="2"/><rect x="616" y="224" width="520" height="316" rx="18" fill="#22221f" stroke="#4f4a42" stroke-width="2"/><text x="94" y="276" font-size="32" font-weight="700" fill="#a7cfb0" text-anchor="start">Paired repetitions</text><text x="94" y="331" font-size="37" font-weight="400" fill="#f2ede3" text-anchor="start">12 + 12 = 24 kg</text><text x="94" y="385" font-size="33" font-weight="400" fill="#f2ede3" text-anchor="start">3 sets × 10 paired reps</text><text x="94" y="469" font-size="41" font-weight="700" fill="#a7cfb0" text-anchor="start">720 kg volume load</text><text x="646" y="276" font-size="32" font-weight="700" fill="#f1a27b" text-anchor="start">Alternating: total reps</text><text x="646" y="331" font-size="34" font-weight="400" fill="#f2ede3" text-anchor="start">8 kg per arm movement</text><text x="646" y="385" font-size="33" font-weight="400" fill="#f2ede3" text-anchor="start">2 sets × 12 total reps</text><text x="646" y="469" font-size="41" font-weight="700" fill="#f1a27b" text-anchor="start">192 kg volume load</text><text x="64" y="593" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">Separate fictional records; do not add or compare these as one workout.</text><text x="64" y="630" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">Count each load once per movement. Not energy or training effectiveness.</text></g></svg>
