<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description"><title id="title">Use the yield of this batch.</title><desc id="description">A 150-gram dry rice input becomes a measured 420-gram cooked batch. A 140-gram cooked portion is one third, representing 50 dry-equivalent grams and 180 kcal under the invented 360-kcal-per-100-gram dry label.</desc><rect width="1200" height="675" fill="#151513"/><path d="M64 158H1136" stroke="#4f4a42" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="53" font-size="23" font-weight="700" fill="#f1a27b" text-anchor="start">ILLUSTRATIVE PLAIN-RICE WORKSHEET</text><text x="64" y="119" font-size="43" font-weight="700" fill="#f2ede3" text-anchor="start">Use the yield of this batch.</text><rect x="64" y="217" width="1072" height="116" rx="18" fill="#22221f" stroke="#4f4a42" stroke-width="2"/><text x="94" y="264" font-size="41" font-weight="700" fill="#f2ede3" text-anchor="start">150 g dry  →  420 g cooked</text><text x="94" y="310" font-size="29" font-weight="400" fill="#c2b9aa" text-anchor="start">A measured yield for this one plain-rice batch</text><rect x="64" y="358" width="515" height="181" rx="18" fill="#22221f" stroke="#4f4a42" stroke-width="2"/><rect x="621" y="358" width="515" height="181" rx="18" fill="#22221f" stroke="#4f4a42" stroke-width="2"/><text x="94" y="407" font-size="38" font-weight="400" fill="#f2ede3" text-anchor="start">140 ÷ 420 = 1/3 of batch</text><text x="94" y="480" font-size="43" font-weight="700" fill="#a7cfb0" text-anchor="start">50 g dry equivalent</text><text x="651" y="407" font-size="40" font-weight="400" fill="#f2ede3" text-anchor="start">50 × 360 ÷ 100</text><text x="651" y="480" font-size="43" font-weight="700" fill="#f1a27b" text-anchor="start">180 kcal estimate</text><text x="64" y="593" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">Invented dry label: 360 kcal per 100 g. All rice retained; uniform batch.</text><text x="64" y="630" font-size="26" font-weight="400" fill="#c2b9aa" text-anchor="start">Not a universal dry-to-cooked ratio or a photo measurement.</text></g></svg>
